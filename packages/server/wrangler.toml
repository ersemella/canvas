name = "canvas-server"
main = "src/index.ts"
compatibility_date = "2025-05-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MANIFEST_REGISTRY"
class_name = "ManifestRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "ManifestRegistry"]

# Production secrets are set via:
#   wrangler secret put MANIFEST_ADMIN_TOKEN
#
# Local dev uses [vars] below. Override per-developer in `.dev.vars` if desired.
[vars]
MANIFEST_ADMIN_TOKEN = "local-dev-token"
