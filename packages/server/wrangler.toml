name = "canvas-server"
main = "src/index.ts"
compatibility_date = "2025-05-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MANIFEST_REGISTRY"
class_name = "ManifestRegistry"

# Caps POST /rooms at 10 per minute per client IP (src/routes/rooms.ts).
[[unsafe.bindings]]
name = "ROOM_CREATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "ManifestRegistry"]

# Production secrets are set via:
#   wrangler secret put MANIFEST_ADMIN_TOKEN
#
# Local dev reads MANIFEST_ADMIN_TOKEN from a gitignored `.dev.vars` file
# (see `.dev.vars.example`) — never from [vars] here, since anything in
# wrangler.toml is also applied to the production deploy in CI.
