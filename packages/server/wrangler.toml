name = "canvas-server"
main = "src/index.ts"
compatibility_date = "2025-05-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MANIFEST_REGISTRY"
class_name = "ManifestRegistry"

# Single-player runs (Silk Road Run): one RunRoom per run, one
# PlayerLedger per player key. See src/routes/runs.ts.
[[durable_objects.bindings]]
name = "RUN_ROOM"
class_name = "RunRoom"

[[durable_objects.bindings]]
name = "PLAYER_LEDGER"
class_name = "PlayerLedger"

# Caps POST /rooms at 10 per minute per client IP (src/routes/rooms.ts).
[[unsafe.bindings]]
name = "ROOM_CREATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "ManifestRegistry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RunRoom", "PlayerLedger"]

# ManifestRegistry is retired (manifests are bundled into the web build) but
# still bound here until a deleted_classes migration removes it; see the
# follow-ups in docs/plans/engine-platform-split.md.

# Secrets, if one is ever needed: `wrangler secret put NAME`, and locally a
# gitignored `.dev.vars` file — never [vars] here, since anything in
# wrangler.toml is also applied to the production deploy in CI.
