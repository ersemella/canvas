name: Release engine

# Publishes @canvas/engine for other repositories as a git tag,
# `engine-v<version>`, holding only the built package (package.json + dist/).
# Bump packages/engine/package.json's version first; an existing tag is
# never overwritten. Consumers install it with
#   "@canvas/engine": "github:ersemella/canvas#engine-v<version>"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Engine typechecks and passes its tests
        run: |
          pnpm --filter @canvas/engine typecheck
          pnpm --filter @canvas/engine test

      - name: Tag must not exist yet
        run: |
          TAG=$(node scripts/release-engine.mjs --version)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists — bump packages/engine/package.json's version"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build the release tree
        run: node scripts/release-engine.mjs "$RUNNER_TEMP/engine-release"

      - name: Commit and push the tag
        working-directory: ${{ runner.temp }}/engine-release
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "@canvas/engine ${TAG#engine-v} (from ${GITHUB_SHA})"
          git tag "$TAG"
          git push "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
