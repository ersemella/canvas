name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "packages/engine/**"
      - "packages/games/**"
      - "packages/server/**"

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gates both jobs: deploy-pages waits on this one.
      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Unit tests
        run: pnpm test

      - name: Deploy Worker (canvas-server)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/server
          command: deploy

      - name: Upload manifests to ManifestRegistry DO
        run: node packages/server/scripts/upload-manifests.mjs
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          MANIFEST_ADMIN_TOKEN: ${{ secrets.MANIFEST_ADMIN_TOKEN }}

  deploy-pages:
    needs: deploy-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @canvas/web build
        env:
          VITE_API_URL: ${{ secrets.SERVER_URL }}

      - run: npm install -g wrangler

      - run: wrangler pages project create canvas --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: wrangler pages deploy packages/web/dist --project-name=canvas --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Plays real games against production right after each deploy: the
  # raw-WebSocket protocol suite and the two-browser suite (see
  # .claude/skills/verify). Creates a short-lived test room in production.
  smoke-prod:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The protocol suite uses Node's built-in WebSocket (Node 22+).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E against production
        run: pnpm e2e
        env:
          E2E_API_URL: ${{ secrets.SERVER_URL }}
          E2E_WEB_URL: ${{ vars.PAGES_URL || 'https://canvas-bdg.pages.dev' }}

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results/
          if-no-files-found: ignore
